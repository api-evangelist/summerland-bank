overlay: 1.0.0
info:
  title: API Evangelist enhancements for Summerland Bank CDR Product Reference Data
  version: 1.0.0
extends: openapi/summerland-bank-cds-banking-products-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-provider: summerland-bank
      x-apievangelist-contract: shared-dsb-cds-banking-api
      x-apievangelist-public-operations:
        - listBankingProducts
        - getBankingProductDetail
      x-apievangelist-notes: >-
        Only the two Banking Products operations are public and unauthenticated at
        https://public.cdr-api.summerland.com.au/cds-au/v1; all other operations
        require CDR accredited-data-recipient OAuth2/OIDC/MTLS consent.
  - target: $.servers
    update:
      - description: Summerland Bank public CDR PRD base (live)
        url: https://public.cdr-api.summerland.com.au/cds-au/v1
  - target: $.paths['/banking/products'].get
    update:
      x-apievangelist-access: public
      x-apievangelist-required-header: 'x-v: 5'
  - target: $.paths['/banking/products/{productId}'].get
    update:
      x-apievangelist-access: public
      x-apievangelist-required-header: 'x-v: 5'
