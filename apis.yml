    type: APIReference
  - url: openapi/summerland-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: >-
    Consumer-authorized CDR banking endpoints for direct debits and scheduled
    payments, part of the DSB Consumer Data Standards Banking API implemented by
    Summerland Bank as a CDR data holder. Covers GET
    /banking/accounts/{accountId}/direct-debits and POST
    /banking/accounts/direct-debits (Get Direct Debits), plus GET
    /banking/accounts/{accountId}/payments/scheduled, GET
    /banking/payments/scheduled and POST /banking/payments/scheduled (Get
    Scheduled Payments). These endpoints are not publicly accessible; they are
    served on the bank's authenticated CDR Resource Base URI (register-discovered)
    and require an OAuth2/FAPI consumer authorization consent under the
    ACCC/OAIC-governed ADR model. Contract is the shared DSB "CDR Banking API"
    v1.36.0 OpenAPI, not bank-proprietary.
- aid: summerland-bank:summerland-bank-cdr-payees-api
  name: Summerland Bank CDR Payees API
  tags:
  - CDR
  - Open Banking
  - Banking
  - Payees
  - Consumer Authorized
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.summerland.com.au/services/digital-and-payments/open-banking/
  baseURL: https://public.cdr-api.summerland.com.au/cds-au/v1/banking/payees
  properties:
  - url: https://www.summerland.com.au/services/digital-and-payments/open-banking/
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-banking-api_get-payees
    type: APIReference
  - url: openapi/summerland-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: >-
    Consumer-authorized CDR banking endpoints for saved payees, part of the DSB
    Consumer Data Standards Banking API implemented by Summerland Bank as a CDR
    data holder. Covers GET /banking/payees (Get Payees) and GET
    /banking/payees/{payeeId} (Get Payee Detail), returning the consumer's saved
    domestic, international, and BPAY payee records. These endpoints are not
    publicly accessible; they are served on the bank's authenticated CDR Resource
    Base URI (register-discovered) and require an OAuth2/FAPI consumer
    authorization consent under the ACCC/OAIC-governed ADR model. Contract is the
    shared DSB "CDR Banking API" v1.36.0 OpenAPI, not bank-proprietary.
