name: Summerland Bank
kind: company
description: >-
  Summerland Bank is a customer-owned (mutual) bank based in Lismore in the
  Northern Rivers region of New South Wales, Australia, tracing its origins to
  the former Summerland Credit Union (Summerland Financial Services Limited,
  ABN 21 087 650 360, AFSL and Australian Credit Licence 241167) and rebranded
  as Summerland Bank in 2023. As an APRA-regulated authorised deposit-taking
  institution (ADI) and certified B Corporation, it is owned by its customers
  rather than shareholders and has announced plans to merge with fellow
  customer-owned Regional Australia Bank. Under Australia's Consumer Data Right
  (CDR / Open Banking), Summerland Bank operates as a data holder: it exposes a
  live, public, unauthenticated Product Reference Data (PRD) API conforming to
  the Data Standards Body (DSB) Consumer Data Standards, and offers
  accredited-recipient consumer data sharing to eligible customers through its
  app and internet banking under the ACCC/OAIC-governed CDR regime.
